name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server syntax check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        run: pip install -r server/requirements.txt httpx

      - name: Compile server
        run: python -m py_compile server/main.py

      - name: Run server tests
        run: python -m unittest discover -s tests

  ios:
    name: iOS compile check
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app for iPhone
        shell: bash
        run: |
          mkdir -p build/logs
          APP_LOG=build/logs/VideoLoader-debug.log
          set -o pipefail
          if ! xcodebuild             -project ios/VideoLoader.xcodeproj             -scheme VideoLoader             -configuration Debug             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             OTHER_CODE_SIGN_FLAGS=""             COMPILER_INDEX_STORE_ENABLE=NO             build 2>&1 | tee "$APP_LOG"; then
            echo "::error::iOS compile check failed. Last 200 log lines:"
            tail -n 200 "$APP_LOG"
            grep -Ei "error:|fatal error:|Command SwiftCompile failed|CompileSwift failed" "$APP_LOG" |
              tail -n 50 |
              while IFS= read -r line; do
                echo "::error::$line"
              done
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VideoLoader-build-logs
          path: build/logs
          if-no-files-found: ignore
